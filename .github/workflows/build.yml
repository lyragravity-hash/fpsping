name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MINECRAFT_VERSION: 1.21.11
  JAVA_VERSION: 21

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.3.0

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jar artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fpsping-jars
          path: build/libs/*.jar
          if-no-files-found: error

  # Publishes the GitHub release + Modrinth version when you push a tag like v1.1.0.
  #
  # One-time Modrinth setup:
  #   1. Create the project on Modrinth and upload v1.1.0 manually (see publishing/CHECKLIST.md)
  #   2. Put its ID or slug into `modrinth-id` below (two places: the guard step and the publish step)
  #   3. Add a repo secret MODRINTH_TOKEN: Modrinth -> Settings -> Authorization token
  #      (token needs the "Create versions" scope)
  # Until MODRINTH_TOKEN exists, tagged pushes still create the GitHub release and skip Modrinth.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          # Full history so the release notes can name the previous tag for the
          # "Full Changelog" compare link.
          fetch-depth: 0

      - name: Download built jars
        uses: actions/download-artifact@v8.0.1
        with:
          name: fpsping-jars
          path: build/libs

      # The tag and the built jar must agree, or we'd publish the wrong files.
      - name: Extract version and verify tag
        run: |
          VERSION="$(grep -E '^version=' gradle.properties | cut -d= -f2 | tr -d ' \r')"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${VERSION} from gradle.properties. Update gradle.properties (or re-tag) so they match."
            exit 1
          fi

      # Release notes are the changelog, so a release reads like real release notes
      # instead of a bare "Full Changelog" compare link. Sections are expected to be
      # ordered newest-first, like the file already is.
      - name: Extract this version's changelog
        run: |
          awk '/^## /{if (found) exit; found=1} found' publishing/CHANGELOG.md | tail -n +2 | awk 'NF{body=1} body' > changelog-section.md
          if [ ! -s changelog-section.md ]; then
            echo "::warning::publishing/CHANGELOG.md has no '## ' section — using the whole file for the release notes."
            cp publishing/CHANGELOG.md changelog-section.md
          fi
          FIRST_HEADING="$(awk '/^## /{print; exit}' publishing/CHANGELOG.md)"
          echo "Newest changelog section: ${FIRST_HEADING:-<none>}"
          case "${FIRST_HEADING}" in
            *"${VERSION}"*) ;;
            *) echo "::warning::Newest changelog section is '${FIRST_HEADING}' but this release is ${VERSION}; publishing/CHANGELOG.md is expected to be newest-first." ;;
          esac

      - name: Compose release notes
        run: |
          PREVIOUS="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo "## FPS & Ping Monitor ${VERSION}"
            echo
            cat changelog-section.md
            echo
            echo "---"
            echo
            if [ -n "${PREVIOUS}" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS}...${GITHUB_REF_NAME}"
            else
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/blob/HEAD/publishing/CHANGELOG.md"
            fi
          } > release-notes.md
          echo "----- release notes -----"
          cat release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: build/libs/*.jar
          body_path: release-notes.md
          overwrite_files: true

      # A brand-new Modrinth project sits in a manual review queue, and until it clears
      # the public API can't resolve the slug — the upload endpoint then rejects it with a
      # confusing 400 "invalid character in base62 encoding". Rather than fail the whole
      # release over that, detect it here and skip cleanly; the scheduled
      # "Modrinth publish watcher" workflow retries and publishes once it's approved.
      - name: Is the Modrinth project resolvable yet?
        id: modrinth
        if: env.MODRINTH_TOKEN != ''
        env:
          MODRINTH_ID: fps-ping-monitor
        run: |
          if [ -z "${MODRINTH_ID}" ] || [ "${MODRINTH_ID}" = "YOUR_MODRINTH_PROJECT_ID" ]; then
            echo "::error::modrinth-id is still the placeholder — put the real project ID or slug into .github/workflows/build.yml and commit."
            exit 1
          fi
          if curl -sf --max-time 20 "https://api.modrinth.com/v2/project/${MODRINTH_ID}" > /dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Modrinth project '${MODRINTH_ID}' is not publicly resolvable yet (awaiting review). Skipping the Modrinth publish — the watcher workflow publishes version ${VERSION} automatically once it is approved."
          fi

      # Send only the newest changelog section to Modrinth, not the whole file.
      - name: Prepare changelog for Modrinth
        if: env.MODRINTH_TOKEN != '' && steps.modrinth.outputs.ready == 'true'
        run: |
          if [ ! -s changelog-section.md ]; then echo "No changelog section found for this release — using full changelog."; cp publishing/CHANGELOG.md changelog-section.md; fi
          head -c 32000 changelog-section.md > release-changelog.md

      - name: Publish to Modrinth
        if: env.MODRINTH_TOKEN != '' && steps.modrinth.outputs.ready == 'true'
        uses: Kir-Antipov/mc-publish@v3.3.1
        with:
          modrinth-id: fps-ping-monitor
          modrinth-token: "${{ env.MODRINTH_TOKEN }}"
          # No `files` needed: mc-publish's default globs already pick
          # build/libs/fpsping-<version>.jar as the primary file and the
          # -sources jar as an additional one. (files-primary/files-secondary
          # are deprecated, so we deliberately don't use those.)
          name: "FPS & Ping Monitor ${{ env.VERSION }}"
          version: "${{ env.VERSION }}"
          version-type: release
          changelog-file: release-changelog.md
          loaders: fabric
          game-versions: "${{ env.MINECRAFT_VERSION }}"
          java: "${{ env.JAVA_VERSION }}"
          dependencies: |
            fabric-api(required)
            modmenu(optional)

      - name: Modrinth publishing skipped
        if: env.MODRINTH_TOKEN == ''
        run: echo "::warning::MODRINTH_TOKEN secret is not set — skipped publishing to Modrinth. The GitHub release was still created."

      - name: Modrinth publishing deferred
        if: env.MODRINTH_TOKEN != '' && steps.modrinth.outputs.ready != 'true'
        run: echo "::warning::Modrinth project still awaiting review — version ${VERSION} will be published by the \"Modrinth publish watcher\" workflow as soon as it is approved. Nothing to do on your side."
