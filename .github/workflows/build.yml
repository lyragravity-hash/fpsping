name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MINECRAFT_VERSION: 1.21.11
  JAVA_VERSION: 21

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.3.0

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jar artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fpsping-jars
          path: build/libs/*.jar
          if-no-files-found: error

  # Publishes the GitHub release + Modrinth version when you push a tag like v1.1.0.
  #
  # One-time Modrinth setup:
  #   1. Create the project on Modrinth and upload v1.1.0 manually (see publishing/CHECKLIST.md)
  #   2. Put its ID or slug into `modrinth-id` below (two places: the guard step and the publish step)
  #   3. Add a repo secret MODRINTH_TOKEN: Modrinth -> Settings -> Authorization token
  #      (token needs the "Create versions" scope)
  # Until MODRINTH_TOKEN exists, tagged pushes still create the GitHub release and skip Modrinth.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download built jars
        uses: actions/download-artifact@v8.0.1
        with:
          name: fpsping-jars
          path: build/libs

      # The tag and the built jar must agree, or we'd publish the wrong files.
      - name: Extract version and verify tag
        run: |
          VERSION="$(grep -E '^version=' gradle.properties | cut -d= -f2 | tr -d ' \r')"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${VERSION} from gradle.properties. Update gradle.properties (or re-tag) so they match."
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: build/libs/*.jar
          generate_release_notes: true
          overwrite_files: true

      - name: Check Modrinth project id
        if: env.MODRINTH_TOKEN != ''
        run: |
          if [ "${MODRINTH_ID}" = "YOUR_MODRINTH_PROJECT_ID" ]; then
            echo "::error::MODRINTH_TOKEN is set, but modrinth-id is still the placeholder. Create the project on Modrinth, then put its ID or slug into .github/workflows/build.yml (publish job) and commit."
            exit 1
          fi
        env:
          MODRINTH_ID: fps-ping-monitor

      # Send only the newest changelog section to Modrinth, not the whole file.
      - name: Extract changelog for this version
        if: env.MODRINTH_TOKEN != ''
        run: |
          awk '/^## /{if (found) exit; found=1} found' publishing/CHANGELOG.md > release-changelog.md
          if [ ! -s release-changelog.md ]; then echo "No changelog section found for this release — using full changelog."; cp publishing/CHANGELOG.md release-changelog.md; fi
          head -c 32000 release-changelog.md > release-changelog.tmp && mv release-changelog.tmp release-changelog.md

      - name: Publish to Modrinth
        if: env.MODRINTH_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3.1
        with:
          modrinth-id: fps-ping-monitor
          modrinth-token: "${{ env.MODRINTH_TOKEN }}"
          files: build/libs/!(*-sources.jar)
          files-secondary: build/libs/*-sources.jar
          name: "FPS & Ping Monitor ${{ env.VERSION }}"
          version: "${{ env.VERSION }}"
          version-type: release
          changelog-file: release-changelog.md
          loaders: fabric
          game-versions: "${{ env.MINECRAFT_VERSION }}"
          java: "${{ env.JAVA_VERSION }}"
          dependencies: |
            fabric-api(required)
            modmenu(optional)

      - name: Modrinth publishing skipped
        if: env.MODRINTH_TOKEN == ''
        run: echo "::warning::MODRINTH_TOKEN secret is not set — skipped publishing to Modrinth. The GitHub release was still created."
